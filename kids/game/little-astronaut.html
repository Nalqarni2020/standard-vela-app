<style>
/* Layout: one screen at a time over a deep-space sky; huge round controls for small hands; a single dark look on purpose. */
:root {
  --space: #0b1033; --space-2: #161d52; --star: #fff4c2; --dim: #aab3e8;

  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--space); color: var(--star); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html[dir="rtl"] body, html[dir="rtl"] button { font-family: var(--font-ar); }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; box-sizing: border-box; }
.top { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.top h1 { flex: 1; margin: 0; font-size: clamp(21px, 5.4vw, 34px); font-weight: 800; text-align: center; text-wrap: balance; line-height: 1.1; }
.round { width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--star); background: var(--space-2); color: var(--star); font: 800 25px/1 var(--font); display: grid; place-items: center; cursor: pointer; flex: none; touch-action: manipulation; padding: 0; }
.round:active, .tile:active, .big:active, .pbtn:active, .lvl:active { transform: scale(.95); }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.round svg { width: 30px; height: 30px; }
html[dir="rtl"] .back-arrow { transform: scaleX(-1); }
.stage { flex: 1; min-height: 0; position: relative; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; }
.helper { display: flex; align-items: center; gap: 10px; min-height: 64px; }
.helper canvas { width: 58px; height: 58px; flex: none; }
.bubble { flex: 1; min-width: 0; background: var(--space-2); border-radius: 22px; padding: 8px 14px; font-size: clamp(17px, 4.4vw, 24px); font-weight: 700; line-height: 1.25; text-wrap: balance; position: relative; }
.hint { margin: 0; text-align: center; font-size: clamp(17px, 4.4vw, 24px); font-weight: 700; text-wrap: balance; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border: 0; border-radius: 26px; background: var(--space-2); color: var(--star); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 6px; font: 800 clamp(16px, 4.2vw, 24px)/1.1 var(--font); box-shadow: inset 0 0 0 3px rgba(255,244,194,.14); touch-action: manipulation; min-width: 0; text-align: center; }
.tile small { font-size: .7em; font-weight: 500; color: var(--dim); }
.tile.hero { grid-column: 1 / -1; flex-direction: row; gap: 14px; background: linear-gradient(120deg, #3a1f7a, #1d3f8a); padding: 14px; }
.c1 { background: #2a1f6e; } .c2 { background: #183f62; } .c3 { background: #4a1f5e; } .c4 { background: #3b2a12; } .c5 { background: #1f4a3a; } .c6 { background: #4a2a1f; } .c7 { background: #2a3a5e; }
.big { border: 0; border-radius: 999px; background: var(--sun); color: #2b1a00; font: 800 clamp(17px, 4.6vw, 24px)/1 var(--font); padding: 15px 24px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; justify-content: center; touch-action: manipulation; }
.big.alt { background: var(--space-2); color: var(--star); box-shadow: inset 0 0 0 3px var(--star); }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }
.play { flex: 1; min-height: 0; position: relative; border-radius: 26px; overflow: hidden; background: rgba(22,29,82,.55); touch-action: none; }
.play canvas.main { position: absolute; inset: 0; width: 100%; height: 100%; }
.badge { position: absolute; top: 10px; inset-inline-start: 10px; background: rgba(11,16,51,.75); border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: clamp(20px, 5.6vw, 30px); display: flex; align-items: center; gap: 8px; z-index: 2; }
.badge canvas { width: 32px; height: 32px; }
.hold { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: 128px; height: 128px; border-radius: 50%; border: 6px solid var(--star); background: var(--nebula); color: #2b0018; font: 800 22px/1.1 var(--font); cursor: pointer; touch-action: none; z-index: 2; }

.choices { position: absolute; inset: auto 10px 12px 10px; display: grid; gap: 10px; z-index: 2; }
.choice { border: 0; border-radius: 24px; background: var(--space-2); color: var(--star); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; font: 800 clamp(16px, 4.2vw, 22px)/1.1 var(--font); box-shadow: inset 0 0 0 3px rgba(255,244,194,.2); touch-action: manipulation; min-width: 0; }
.choice canvas { width: 84px; height: 84px; max-width: 100%; }

.lvl { border: 0; border-radius: 22px; background: rgba(11,16,51,.6); color: var(--star); cursor: pointer; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 800 30px/1 var(--font); box-shadow: inset 0 0 0 3px rgba(255,244,194,.25); touch-action: manipulation; }

.lvl.next { box-shadow: inset 0 0 0 4px var(--sun); background: rgba(255,201,60,.15); }
.lvl:disabled { opacity: .35; cursor: default; }
.rank { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: clamp(17px, 4.4vw, 22px); }
/* book & stickers */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.card { border: 0; background: var(--space-2); color: var(--star); border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; font: 700 16px/1.15 var(--font); text-align: center; min-width: 0; cursor: pointer; touch-action: manipulation; }
.card canvas { width: 76px; height: 76px; }
.card.no { opacity: .45; cursor: default; }
.detail { position: absolute; inset: 0; background: rgba(11,16,51,.96); border-radius: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; box-sizing: border-box; z-index: 4; }
.detail canvas { width: 100%; flex: 1; min-height: 0; }
.detail h2 { margin: 0; font-size: clamp(28px, 8vw, 46px); color: var(--sun); line-height: 1; text-align: center; }
.detail p { margin: 0; font-size: clamp(19px, 5vw, 27px); font-weight: 700; text-align: center; max-width: 30ch; text-wrap: balance; line-height: 1.3; min-height: 2.6em; }
.dots { display: flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); opacity: .4; } .dots i.on { background: var(--sun); opacity: 1; }
/* level complete */
.done { position: absolute; inset: 0; z-index: 6; background: rgba(11,16,51,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; border-radius: 26px; }
.done h2 { margin: 0; font-size: clamp(30px, 8vw, 48px); color: var(--sun); }
.done .stars { display: flex; gap: 8px; } .done .stars canvas { width: 72px; height: 72px; }
.fact { background: var(--space-2); border-radius: 24px; padding: 12px 16px; max-width: 32ch; font-size: clamp(18px, 4.8vw, 24px); font-weight: 700; line-height: 1.3; }
.fact b { display: block; color: var(--mint); font-size: .8em; margin-bottom: 4px; }
.toast { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--sun); color: #2b1a00; border-radius: 30px; padding: 12px 22px; font-weight: 800; font-size: clamp(21px, 6vw, 32px); text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.25); z-index: 8; pointer-events: none; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); box-sizing: border-box; }

@media (prefers-reduced-motion: no-preference) { .toast, .done .stars canvas { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; } .done .stars canvas:nth-child(2) { animation-delay: .25s; } .done .stars canvas:nth-child(3) { animation-delay: .5s; } }

.toast { animation-name: popc; } @keyframes popc { from { transform: translate(-50%, -50%) scale(.3); } to { transform: translate(-50%, -50%) scale(1); } }
.parent { font-size: 14px; color: var(--dim); text-align: center; }
.parent button { background: none; border: 0; color: var(--dim); text-decoration: underline; font: inherit; cursor: pointer; padding: 8px; }
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
</style>

    } else if (phase === "down") { y = Math.max(0, y - dt * .14); if (y === 0) { phase = "pad"; fuel = 0; chute = false; btn.disabled = false; } }
    x.clearRect(0, 0, w, h);

    x.save(); x.beginPath(); x.arc(w / 2, ground + w * 1.2, w * 1.25, 0, 7); x.clip(); planet(x, w / 2, ground + w * 1.2, w * 1.25, "earth", now); x.restore();
    const gx = 18, gh = Math.min(230, h * .52), gy = ground - gh - 20;
    x.fillStyle = "rgba(255,244,194,.18)"; x.fillRect(gx, gy, 28, gh);
    x.fillStyle = "rgba(111,240,196,.45)"; x.fillRect(gx, gy + gh * (1 - cfg.max), 28, gh * (cfg.max - cfg.min));
    const inZone = fuel >= cfg.min && fuel <= cfg.max;
    x.fillStyle = inZone ? "#6ff0c4" : fuel > cfg.max ? "#ff6b6b" : "#ffc93c"; x.fillRect(gx + 5, gy + gh * (1 - fuel), 18, gh * fuel);
    x.strokeStyle = "#fff4c2"; x.lineWidth = 3; x.strokeRect(gx, gy, 28, gh);
    star(x, gx + 14, gy + gh * (1 - (cfg.min + cfg.max) / 2), 9, "#6ff0c4");
    let rxp = w / 2, ryp = ground - size * .45 - y;
    if (phase === "landed") {
      if (target === "jupiter") { rxp = w * .72 - tR * 1.6; ryp = tY + tR * .2; }
      else { rxp = w * .72; ryp = tY - tR - size * .42; x.fillStyle = "#fff"; x.fillRect(w * .72 + tR * .55, tY - tR * 1.55, 3, tR * .75); x.fillStyle = "#e8434f"; x.fillRect(w * .72 + tR * .55 + 3, tY - tR * 1.55, tR * .45, tR * .3); }
    } else if (phase === "up" && good()) rxp = w / 2 + (w * .72 - w / 2) * Math.max(0, (y - climb * .6) / (climb * .4)) * (target === "jupiter" ? .6 : 1);
    if (chute) { x.fillStyle = "#ff7ab8"; x.beginPath(); x.arc(rxp, ryp - size * .9, size * .55, Math.PI, 2 * Math.PI); x.fill(); x.strokeStyle = "#fff4c2"; x.lineWidth = 2; x.beginPath(); x.moveTo(rxp - size * .55, ryp - size * .9); x.lineTo(rxp - size * .1, ryp - size * .45); x.moveTo(rxp + size * .55, ryp - size * .9); x.lineTo(rxp + size * .1, ryp - size * .45); x.stroke(); }
    rocket(x, rxp, ryp, size, phase === "landed" && target === "jupiter" ? .9 : 0, phase === "up" || filling);
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop); onCleanup(() => cancelAnimationFrame(raf));
};

/* ---- planet quiz ---- */
GAMES.quiz = function (s, cfg, done) {
  const help = helper("", false); s.appendChild(help.el);
  const play = el("div", "play"); const cv = el("canvas", "main"); play.appendChild(cv); s.appendChild(play);
  const grid = el("div", "choices"); play.appendChild(grid);
  const qs = shuffle(cfg.qs).slice(0, cfg.rounds); let round = 0, mistakes = 0, raf = 0, show = null;
  function ask() {
    const q = QS[qs[round]], opts = shuffle([q.a].concat(shuffle(q.from.filter(o => o !== q.a)).slice(0, cfg.n - 1)));
    const text = q.find ? (lang === "ar" ? "أين " + name(q.a) + "؟" : "Where is " + name(q.a) + "?") : q[lang];
    help.set(text); grid.innerHTML = ""; grid.style.gridTemplateColumns = "repeat(" + Math.min(cfg.n, 4) + ", 1fr)"; show = null;
    let wrong = false;
    opts.forEach(id => {
      const b = button("choice", null, () => {
        if (b.classList.contains("no") || grid.dataset.lock) return;
        if (id === q.a) {
          grid.dataset.lock = "1"; b.classList.add("ok"); sfx.ding(); show = id;
          const fact = facts(id)[0]; help.set(pick(t("right")) + " " + name(id) + ". " + fact);
          if (!wrong) award(id);
          setTimeout(() => { delete grid.dataset.lock; round++; if (round < qs.length) ask(); else { grid.innerHTML = ""; done(mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1); } }, 3600);
        } else { b.classList.add("no"); wrong = true; mistakes++; sfx.bonk(); say(t("tryAgain")); }
      });
      b.appendChild(iconCanvas(id, 84)); if (!q.find || cfg.n <= 2) b.appendChild(el("span", null, name(id)));
      grid.appendChild(b);
    });
  }
  (function loop(now) { const { x, w, h } = fit(cv); x.clearRect(0, 0, w, h); if (show) planet(x, w / 2, h * .3, Math.min(w, h) * (show === "saturn" ? .14 : .18), show, now); else for (let i = 0; i < 5; i++) star(x, w * (.2 + i * .15), h * (.22 + Math.sin(now / 500 + i) * .04), 10 + i % 2 * 4, i % 2 ? "#ffd23f" : "#ff7ab8"); raf = requestAnimationFrame(loop); })(performance.now());
  onCleanup(() => cancelAnimationFrame(raf));
  ask();
};

/* ---- count the stars ---- */
GAMES.count = function (s, cfg, done) {
  const help = helper(t("countHint")); s.appendChild(help.el);
  const play = el("div", "play"); const cv = el("canvas", "main"); play.appendChild(cv); s.appendChild(play);
  const grid = el("div", "choices"); play.appendChild(grid);
  let pts = [], counted = 0, raf = 0, mistakes = 0, asking = false;
  const COLORS = ["#ffd23f", "#ff7ab8", "#6ff0c4", "#8fd6ff"];
  function setup() {
    const w = cv.clientWidth, h = cv.clientHeight * .62, r = Math.max(22, Math.min(w, h) * .085);
    pts = []; let guard = 0;
    while (pts.length < cfg.n && guard++ < 2000) { const p = { x: r * 1.4 + Math.random() * (w - r * 2.8), y: r * 1.4 + Math.random() * (h - r * 2.4), r, on: 0, c: pick(COLORS) }; if (pts.every(q => Math.hypot(q.x - p.x, q.y - p.y) > r * 2.6)) pts.push(p); }
  }
  function draw(now) {
    const { x, w, h } = fit(cv); x.clearRect(0, 0, w, h);
    pts.forEach((p, i) => { const k = p.on ? 1 + .15 * Math.max(0, 1 - (now - p.on) / 300) : 1; star(x, p.x, p.y, p.r * k, p.on ? p.c : "rgba(170,179,232,.35)", p.on ? "#fff6c8" : "rgba(255,244,194,.7)"); if (p.on) { x.fillStyle = "#2b1a00"; x.font = "800 " + Math.round(p.r * .8) + "px " + getComputedStyle(document.body).fontFamily; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(num(p.n), p.x, p.y + 2); } });
    raf = requestAnimationFrame(draw);
  }
  cv.addEventListener("pointerdown", e => {
    if (asking) return; const b = cv.getBoundingClientRect(), px = e.clientX - b.left, py = e.clientY - b.top;
    const p = pts.find(q => !q.on && Math.hypot(q.x - px, q.y - py) < q.r * 1.3); if (!p) return;
    counted++; p.on = performance.now(); p.n = counted; sfx.tick(counted); say(t("numbers")[counted] || num(counted));
    if (counted === cfg.n) setTimeout(askHowMany, 900);
  });
  function askHowMany() {
    asking = true; help.set(t("howMany"));
    const opts = new Set([cfg.n]); while (opts.size < cfg.choices) { const d = cfg.n + pick([-3, -2, -1, 1, 2, 3]); if (d > 0) opts.add(d); }
    grid.style.gridTemplateColumns = "repeat(" + cfg.choices + ", 1fr)";
    shuffle([...opts]).forEach(v => { const b = button("choice num", num(v), () => { if (b.classList.contains("no")) return; if (v === cfg.n) { b.classList.add("ok"); sfx.ding(); help.set(pick(t("right")) + " " + (t("numbers")[v] || num(v)) + "!"); grid.querySelectorAll("button").forEach(x => x.disabled = true); setTimeout(() => done(mistakes === 0 ? 3 : mistakes === 1 ? 2 : 1), 1400); } else { b.classList.add("no"); mistakes++; sfx.bonk(); say(t("tryAgain")); } }); grid.appendChild(b); });
  }
  requestAnimationFrame(() => { fit(cv); setup(); raf = requestAnimationFrame(draw); });
  onCleanup(() => cancelAnimationFrame(raf));
};

/* ---- connect the stars (constellations) ---- */
GAMES.connect = function (s, cfg, done) {
  const id = cfg.c === "random" ? pick(Object.keys(CONST)) : cfg.c, C = CONST[id];
  const help = helper(t("connectHint")); s.appendChild(help.el);
  const play = el("div", "play"); const cv = el("canvas", "main"); play.appendChild(cv); s.appendChild(play);
  let next = 0, mistakes = 0, raf = 0, finished = false, flash = -1, flashT = 0, pts = [];
  function layout(w, h) { const m = Math.max(40, Math.min(w, h) * .1); return C.p.map(([a, b]) => ({ x: m + a * (w - m * 2), y: m + b * (h - m * 2) })); }
  function draw(now) {
    const { x, w, h } = fit(cv); x.clearRect(0, 0, w, h); pts = layout(w, h);
    const r = Math.max(20, Math.min(w, h) * .055);
    x.lineWidth = 5; x.lineCap = "round"; x.strokeStyle = "#8fd6ff";
    C.e.forEach(([a, b]) => { if (a < next && b < next) { x.beginPath(); x.moveTo(pts[a].x, pts[a].y); x.lineTo(pts[b].x, pts[b].y); x.stroke(); } });
    pts.forEach((p, i) => {
      const lit = i < next, isNext = i === next && !finished, pulse = isNext && !RM ? 1 + .12 * Math.sin(now / 200) : 1;
      star(x, p.x, p.y, r * pulse, lit ? "#ffd23f" : isNext ? "#ff7ab8" : "rgba(170,179,232,.4)", flash === i && now - flashT < 400 ? "#ff6b6b" : "#fff6c8");
      x.fillStyle = lit || isNext ? "#2b1a00" : "#fff4c2"; x.font = "800 " + Math.round(r * .8) + "px " + getComputedStyle(document.body).fontFamily; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(num(i + 1), p.x, p.y + 2);
    });
    raf = requestAnimationFrame(draw);
  }
  cv.addEventListener("pointerdown", e => {
    if (finished) return; const b = cv.getBoundingClientRect(), px = e.clientX - b.left, py = e.clientY - b.top, r = Math.max(20, Math.min(b.width, b.height) * .055);
    const i = pts.findIndex(p => Math.hypot(p.x - px, p.y - py) < r * 1.6); if (i < 0) return;
    if (i === next) { next++; sfx.tick(next); say(t("numbers")[next] || num(next)); if (next === C.p.length) { finished = true; award(id); setTimeout(() => { help.set(t("connectDone")(C[lang][0]) + " " + C[lang][1]); }, 500); setTimeout(() => done(mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1), 4200); } }
    else if (i > next) { mistakes++; flash = i; flashT = performance.now(); sfx.bonk(); }
  });
  raf = requestAnimationFrame(draw); onCleanup(() => cancelAnimationFrame(raf));
  setTimeout(() => say(CONST_INTRO[lang] + " " + t("connectHint")), 300);
};

/* ================= explore (free play) ================= */
function explore() {
  titleEl.textContent = t("gExplore");
  const s = el("section", "screen"); s.appendChild(helper(t("exploreHint")).el);
  const row = el("div", "scroll"); const g = el("div", "grid");
  ORDER.forEach(id => { const c = button("card", null, () => visit(s, id, true)); c.appendChild(iconCanvas(id, 76)); c.appendChild(el("span", null, name(id))); g.appendChild(c); });
  row.appendChild(g); s.appendChild(row); stage.appendChild(s);

function visit(s, id, fly) {
  sfx.whoosh(); say(name(id));
  const v = el("div", "detail"); const cv = el("canvas"); const h2 = el("h2", null, name(id)); const p = el("p", null, ""); const dots = el("div", "dots"); const r = el("div", "row");
  const list = facts(id); let fi = 0;
  list.forEach(() => dots.appendChild(el("i")));
  const showFact = () => { p.textContent = list[fi]; [...dots.children].forEach((d, i) => d.classList.toggle("on", i === fi)); say(list[fi]); };
  r.appendChild(button("big", t("more"), () => { fi = (fi + 1) % list.length; showFact(); sfx.pop(); }));
  r.appendChild(button("big alt", t("back"), () => { cancelAnimationFrame(raf); v.remove(); }));
  v.appendChild(cv); v.appendChild(h2); v.appendChild(p); v.appendChild(dots); v.appendChild(r); s.appendChild(v);
  const t0 = performance.now(); let told = false, raf = 0;
  (function loop(now) {
    const { x, w, h } = fit(cv); x.clearRect(0, 0, w, h);
    const k = fly ? Math.min(1, (now - t0) / 1200) : 1, e = 1 - Math.pow(1 - k, 3);
    const R = Math.min(w, h) * (id === "saturn" ? .26 : .34) * (.4 + .6 * e), px = w * .6, py = h * .5;
    if (LOOK[id]) planet(x, px, py, R, id, now); else iconFor(x, w, h, id, now);
    if (fly && LOOK[id]) rocket(x, w * .08 + (px - R * 1.25 - w * .08) * e, h * .9 - (h * .9 - py) * e, Math.min(w, h) * .3, Math.PI / 2.4 * (1 - e) + Math.PI / 2 * e, k < 1);
    if (k >= 1 && !told) { told = true; setTimeout(showFact, 400); if (award(id)) setTimeout(() => { sfx.yay(); toast(t("newSticker"), id, 2200); }, 2600); }
    raf = requestAnimationFrame(loop);
  })(t0);
  onCleanup(() => cancelAnimationFrame(raf));
}
