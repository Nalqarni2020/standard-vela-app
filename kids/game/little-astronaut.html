<title>Little Astronaut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: one screen at a time over a deep-space sky; huge round controls for small hands; a single dark look on purpose. */
:root {
  --space: #0b1033;      /* night sky */

  --nebula: #ff7ab8;     /* second accent, pink */
  --mint: #6ff0c4;       /* success */

}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--space); color: var(--star); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html[dir="rtl"] body { font-family: var(--font-ar); }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; box-sizing: border-box; }
.top { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.top h1 { flex: 1; margin: 0; font-size: clamp(22px, 5.5vw, 34px); font-weight: 800; letter-spacing: .01em; text-align: center; text-wrap: balance; line-height: 1.1; }
.round { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--star); background: var(--space-2); color: var(--star); font: 800 26px/1 var(--font); display: grid; place-items: center; cursor: pointer; flex: none; touch-action: manipulation; }
html[dir="rtl"] .round { font-family: var(--font-ar); }
.round:active { transform: scale(.94); }
.round:focus-visible, .tile:focus-visible, .pbtn:focus-visible, .big:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.round[hidden] { display: none !important; }
.round svg { width: 30px; height: 30px; }
html[dir="rtl"] .back-arrow { transform: scaleX(-1); }
.stage { flex: 1; min-height: 0; position: relative; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; }
.hint { margin: 0; text-align: center; font-size: clamp(18px, 4.6vw, 26px); font-weight: 700; color: var(--star); text-wrap: balance; }
.hint small { display: block; font-size: .7em; color: var(--dim); font-weight: 500; }

.tile { border: 0; border-radius: 28px; background: var(--space-2); color: var(--star); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; font: 800 clamp(17px, 4.4vw, 26px)/1.1 var(--font); box-shadow: inset 0 0 0 3px rgba(255,244,194,.14); touch-action: manipulation; min-width: 0; }
html[dir="rtl"] .tile { font-family: var(--font-ar); }

.tile canvas { width: min(26vw, 150px); height: min(26vw, 150px); max-width: 100%; }
.tile.t1 { background: #2a1f6e; } .tile.t2 { background: #183f62; } .tile.t3 { background: #4a1f5e; } .tile.t4 { background: #3b2a12; }
.big { border: 0; border-radius: 999px; background: var(--sun); color: #2b1a00; font: 800 clamp(18px, 4.6vw, 24px)/1 var(--font); padding: 16px 26px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; justify-content: center; touch-action: manipulation; }
html[dir="rtl"] .big { font-family: var(--font-ar); }
.big.alt { background: var(--space-2); color: var(--star); box-shadow: inset 0 0 0 3px var(--star); }
.big:active { transform: scale(.96); }
.row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.planets { flex: 1; display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; align-items: center; scroll-snap-type: x mandatory; padding-block: 8px; -webkit-overflow-scrolling: touch; }
.pbtn { flex: none; scroll-snap-align: center; border: 0; background: transparent; color: var(--star); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font: 800 clamp(18px, 4.5vw, 24px)/1 var(--font); position: relative; padding: 6px; border-radius: 22px; touch-action: manipulation; }

.badge canvas { position: static; width: 34px; height: 34px; }

.hold:disabled { opacity: .4; }

.book { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; align-content: start; padding-bottom: 8px; }
.stk { background: var(--space-2); border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; font-weight: 700; font-size: 16px; text-align: center; min-width: 0; }
.stk canvas { width: 76px; height: 76px; }

.toast { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--sun); color: #2b1a00; border-radius: 30px; padding: 14px 24px; font-weight: 800; font-size: clamp(22px, 6vw, 34px); text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.25); z-index: 5; pointer-events: none; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); box-sizing: border-box; }

@media (prefers-reduced-motion: no-preference) { .toast { animation: pop .45s cubic-bezier(.2,1.6,.4,1); } }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.3); } to { transform: translate(-50%, -50%) scale(1); } }
.parent { font-size: 14px; color: var(--dim); text-align: center; }
.parent button { background: none; border: 0; color: var(--dim); text-decoration: underline; font: inherit; cursor: pointer; padding: 8px; }
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
</style>
